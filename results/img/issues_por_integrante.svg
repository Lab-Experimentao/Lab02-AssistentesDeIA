<svg viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chartTitle chartDesc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="chartTitle">Issues do GitHub Projects por integrante</title>
  <desc id="chartDesc">Gráfico de barras horizontais mostrando o número de issues atribuídas a cada integrante do grupo: Felipe 17, Gabriel 16, Arthur 14, de um total de 41 issues no repositório (3 delas atribuídas aos três integrantes ao mesmo tempo).</desc>

  <style>
    .surface   { fill: #fcfcfb; }
    .title     { fill: #0b0b0b; font-size: 15px; font-weight: 600; }
    .subtitle  { fill: #52514e; font-size: 11.5px; }
    .cat-label { fill: #0b0b0b; font-size: 12.5px; font-weight: 500; }
    .value-label { fill: #0b0b0b; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tick      { fill: #898781; font-size: 11px; }
    .grid      { stroke: #e1e0d9; stroke-width: 1; }
    .baseline  { stroke: #c3c2b7; stroke-width: 1; }
    .bar       { fill: #2a78d6; }

    @media (prefers-color-scheme: dark) {
      .surface   { fill: #1a1a19; }
      .title     { fill: #ffffff; }
      .subtitle  { fill: #c3c2b7; }
      .cat-label { fill: #ffffff; }
      .value-label { fill: #ffffff; }
      .tick      { fill: #898781; }
      .grid      { stroke: #2c2c2a; }
      .baseline  { stroke: #383835; }
      .bar       { fill: #3987e5; }
    }
  </style>

  <rect class="surface" x="0" y="0" width="640" height="210" />

  <text class="title" x="20" y="24">Issues do GitHub Projects por integrante</text>
  <text class="subtitle" x="20" y="42">41 issues no total (LAB02S01-S03 + Relatório Final) · 3 delas atribuídas aos três integrantes ao mesmo tempo</text>

  <!-- gridlines -->
  <line class="grid" x1="190"   y1="58" x2="190"   y2="176" />
  <line class="grid" x1="292.5" y1="58" x2="292.5" y2="176" />
  <line class="grid" x1="395"   y1="58" x2="395"   y2="176" />
  <line class="grid" x1="497.5" y1="58" x2="497.5" y2="176" />
  <line class="grid" x1="600"   y1="58" x2="600"   y2="176" />

  <!-- baseline -->
  <line class="baseline" x1="190" y1="184" x2="600" y2="184" />

  <!-- tick labels -->
  <text class="tick" x="190"   y="198" text-anchor="middle">0</text>
  <text class="tick" x="292.5" y="198" text-anchor="middle">5</text>
  <text class="tick" x="395"   y="198" text-anchor="middle">10</text>
  <text class="tick" x="497.5" y="198" text-anchor="middle">15</text>
  <text class="tick" x="600"   y="198" text-anchor="middle">20</text>

  <!-- Felipe: 17 -->
  <text class="cat-label" x="180" y="77" text-anchor="end">Felipe</text>
  <path class="bar" d="M 190,62 H 534.5 A 4,4 0 0 1 538.5,66 V 82 A 4,4 0 0 1 534.5,86 H 190 Z" />
  <text class="value-label" x="546.5" y="77.5">17</text>

  <!-- Gabriel: 16 -->
  <text class="cat-label" x="180" y="121" text-anchor="end">Gabriel</text>
  <path class="bar" d="M 190,106 H 514 A 4,4 0 0 1 518,110 V 126 A 4,4 0 0 1 514,130 H 190 Z" />
  <text class="value-label" x="526" y="121.5">16</text>

  <!-- Arthur: 14 -->
  <text class="cat-label" x="180" y="165" text-anchor="end">Arthur</text>
  <path class="bar" d="M 190,150 H 473 A 4,4 0 0 1 477,154 V 170 A 4,4 0 0 1 473,174 H 190 Z" />
  <text class="value-label" x="485" y="165.5">14</text>
</svg>
